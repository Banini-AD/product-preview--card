<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./styles/style.css">
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
</head>
<body>
  <header>
    <!-- This is the header -->
  </header>
  <main>
    <div class="image">
      <img src="./images/image-product-mobile.jpg" alt="image-product">
    </div>
    <article class="info">
      <p class="perfume">Perfume</p>
      <h1 class="info-header">
        Gabrielle Essence Eau De Parfum
      </h1>
      <p class="info-description">
        A floral, solar and voluptuous interpretation composed by Olivier<br> Polge,
Perfumer-Creator for the House of CHANEL.
      </p>
      <div class="price-box">
        <h1 class="ac-price">
          $149.99
        </h1>
        <p class="cancelled-price">
          $169.99
        </p>
      </div>
      <button class="button">
        <img src="./images/icon-cart.svg"> Add to Cart
      </button>
    </article>
  </main>
  <footer>
    <!--This is the footer-->
  </footer>
  
  <aside class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Banini-AD</a>.
  </aside>
</body>
</html>
